    <script>
      (function () {
        function isBrowserExtensionOrigin(text) {
          if (!text || typeof text !== 'string') return false;
          return (
            text.indexOf('chrome-extension://') !== -1 ||
            text.indexOf('moz-extension://') !== -1 ||
            text.indexOf('safari-extension://') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            var src = (e && e.filename) || '';
            var stack = (e && e.error && e.error.stack) || '';
            if (isBrowserExtensionOrigin(src) || isBrowserExtensionOrigin(stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e && e.reason;
            var stack = (reason && reason.stack) || '';
            var msg = (reason && reason.message) || String(reason || '');
            if (
              isBrowserExtensionOrigin(stack) ||
              msg.indexOf('Failed to connect to MetaMask') !== -1
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
